        <video class="shipin3" src="images/视频3.mp4" style="width: 650px;" controls="controls"></video>
        <form>
            <h3 class="yhdl">用户登录</h3><br>
            用户名<br>
            <input type="text">
            <br>
            密码<br>
            <input type="password">
            <br>
            <br>
            <input class="k1" type="submit" value="登录">
            <br><br>
            <a class="a-9" href="#">忘记密码?</a>|<a class="a-9" href="">注册新账号</a>
        </form>
        <div class="box-9">
            <p class="box-text">让我们一起探索山城重庆吧!</p>
        </div>

        <script>
            // 获取登录表单元素
            let userInput = document.querySelector('input[type="text"]');
            let pwdInput = document.querySelector('input[type="password"]');
            let loginBtn = document.querySelector('input[type="submit"]');

            // 阻止表单默认提交刷新页面
            loginBtn.onclick = function (e) {
                e.preventDefault();
                let username = userInput.value.trim();
                let password = pwdInput.value.trim();

                if (username === "") {
                    alert("用户名不能为空");
                    return;
                }
                if (password === "") {
                    alert("密码不能为空");
                    return;
                }
                alert("登录成功！用户名：" + username);
            }
        </script>
