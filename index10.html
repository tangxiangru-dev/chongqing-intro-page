        <!--头顶标题  开始-->
        <div class="content-header">
            <h1 class="title">留言</h1>
            <hr class="line">
        </div>
        <img class="pic-10" src="images/留言.jpg" alt=""> <img class="pic10" src="images/留言1.jpg" alt="">
        <form class="f-10">
            <h3 class="lyb">留言板</h3><br>
            姓名<br>
            <input type="text"><br>
            邮箱<br>
            <input type="text"><br>
            留言内容<br>
            <input class="lynr" type="text"><br><br>
            <input type="submit">
        </form>

        <div class="box-10">
            <p class="box-text">让我们一起探索山城重庆吧!</p>
        </div>

        <script>
            let nameInput = document.querySelectorAll('input[type="text"]')[0];
            let emailInput = document.querySelectorAll('input[type="text"]')[1];
            let msgInput = document.querySelectorAll('input[type="text"]')[2];
            let submitBtn = document.querySelector('input[type="submit"]');

            submitBtn.onclick = function (e) {
                e.preventDefault();
                let nameVal = nameInput.value.trim();
                let emailVal = emailInput.value.trim();
                let msgVal = msgInput.value.trim();

                if (nameVal === "") {
                    alert("请填写姓名");
                    return;
                }
                if (emailVal === "") {
                    alert("请填写邮箱");
                    return;
                }
                if (msgVal === "") {
                    alert("请填写留言内容");
                    return;
                }
                alert(`留言提交成功\n姓名：${nameVal}\n邮箱：${emailVal}\n留言：${msgVal}`);
                // 提交之后清空输入框
                nameInput.value = "";
                emailInput.value = "";
                msgInput.value = "";
            }
        </script>

    </body>
